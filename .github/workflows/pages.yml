name: Publish web companion

# Hosting, as of 14 October 2026: GitHub Pages at https://journal.prayersealed.org/
#
# The companion was previously served from an OpenAI Sites project. That origin
# is deliberately kept alive so readers can export journals from it — browser
# storage is per-origin and does not follow a domain change. See
# docs/HOSTING-GITHUB-PAGES-2026-10-14.md.
#
# Three jobs, answering three questions:
#
#   checks   — is this good? The suite, the rendered-browser accessibility
#              harness, and the artifact validator. Nothing here is conditional,
#              so the gate cannot be skipped by choosing to publish.
#   package  — could this be published? Needs checks. This is where Pages is
#              configured and the artifact uploaded.
#   deploy   — publish it. Needs package, so a failed check cannot reach a site.
#
# Publication history, so the job split below reads as deliberate rather than
# defensive: `package` used to fail on every run, because GitHub Pages is not
# available for a private repository on an organization's free plan —
#
#   Get Pages site failed ... HttpError: Not Found
#   POST /repos/.../pages -> 422 Your current plan does not support GitHub
#   Pages for this repository.
#
# The repository was made public on 14 October 2026 and Pages enabled with
# Actions as the source, so all three jobs now pass. The split stays: it keeps
# the quality signal (`checks`) separate from the ability to publish
# (`package`), so a hosting problem can never be mistaken for a broken
# companion. See docs/HOSTING-GITHUB-PAGES-2026-10-14.md.

on:
  push:
    branches: [main]
  # Pull requests run `checks` only. Without this a PR carried no signal at all,
  # which is how the compatibility defect this repository just fixed could have
  # been merged without anything noticing.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Test suite
        run: npm test

      # The rendered-browser accessibility and reflow harness. This was prepared
      # but had never run: the October 13 environment could not launch Chromium
      # (a required Unix socket was denied) and the cloud browser could not reach
      # a loopback preview. Running it here is what stops "prepared" being
      # mistaken for "verified" again.
      - name: Install Chromium for the browser harness
        run: npx playwright install --with-deps chromium

      - name: Rendered-browser accessibility and reflow harness
        run: npm run test:browser

      - name: Validate the artifact that would be published
        run: npm run validate:artifact

      # The offline half of native-app compatibility: are the compat/ copies
      # still the bytes recorded in compat/SOURCE.json, do the interchange
      # versions still agree, and does the app's own importer still run clean
      # against ordinary companion output? Whether native main has moved is a
      # different question, answered by .github/workflows/native-drift.yml.
      - name: Native interchange contract
        run: npm run verify:app-compat

  package:
    needs: checks
    # A pull request must never publish. This is not the kind of conditional the
    # comment above warns about: a push to main is still unconditional, so a
    # deploy cannot silently stop happening — only a PR is excluded, and a PR
    # publishing would be the bug.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Re-run the artifact validator here rather than trusting the previous
      # job: this is the job that actually hands bytes to Pages, and the CNAME
      # check is the one that keeps the site at the intended address.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the artifact being uploaded
        run: npm run validate:artifact

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
